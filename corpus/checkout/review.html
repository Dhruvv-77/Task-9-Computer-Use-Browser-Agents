<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout — Review</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1a1d21; }
  header { background: #1f2937; color: #fff; padding: 14px 24px; }
  .wrap { max-width: 640px; margin: 40px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 28px; }
  .steps { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
  .steps b { color: #2563eb; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  td { padding: 10px 6px; border-bottom: 1px solid #eceff3; font-size: 15px; }
  td:last-child { text-align: right; }
  .total td { font-weight: 700; border-bottom: none; }
  .primary { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 14px 26px; font-size: 17px; cursor: pointer; }
  .primary:hover { background: #15803d; }
  .secondary { background: #fff; color: #374151; border: 1px solid #cbd2da; border-radius: 8px; padding: 14px 26px; font-size: 17px; cursor: pointer; margin-left: 10px; }
  .note { font-size: 13px; color: #6b7280; margin-top: 14px; }
</style>
</head>
<body>
<header><strong>Acme Shop</strong> — secure checkout</header>
<div class="wrap">
  <div class="steps">Step <b>3 of 3</b> — Review</div>
  <h1>Review your order</h1>
  <table>
    <tr><td>Mechanical Keyboard</td><td>$89.00</td></tr>
    <tr><td>USB-C Hub</td><td>$41.00</td></tr>
    <tr class="total"><td>Total</td><td>$130.00</td></tr>
  </table>
  <button id="place-order" class="primary" data-irreversible="true">Place order</button>
  <button id="back-to-cart" class="secondary" onclick="location.href='index.html'">Back to cart</button>
  <div class="note">Placing the order charges your card and cannot be undone.</div>
  <script>
    document.getElementById('place-order').addEventListener('click', function () {
      location.href = 'success.html';
    });
  </script>
</div>
</body>
</html>
