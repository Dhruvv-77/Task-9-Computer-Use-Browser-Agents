<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile settings</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1a1d21; }
  header { background: #4338ca; color: #fff; padding: 14px 24px; }
  .wrap { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 28px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd2da; border-radius: 6px; font-size: 15px; font-family: inherit; }
  .hint { font-size: 13px; color: #6b7280; margin-top: 4px; }
  .primary { margin-top: 20px; background: #4338ca; color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 16px; cursor: pointer; }
  .saved { display: none; margin-top: 18px; background: #e0e7ff; color: #3730a3; border-radius: 8px; padding: 12px 14px; font-size: 15px; }
</style>
</head>
<body>
<header><strong>Community</strong> — your profile</header>
<div class="wrap">
  <h1>Edit profile</h1>
  <label for="display-name">Display name</label>
  <input id="display-name" type="text" placeholder="e.g. your_display_name">
  <div class="hint">Other members see this name on your posts.</div>
  <label for="bio">Bio</label>
  <textarea id="bio" rows="3" placeholder="Tell the community about yourself"></textarea>
  <button id="save-profile" class="primary">Save profile</button>
  <div id="profile-saved" class="saved">Your profile has been updated.</div>
  <script>
    document.getElementById('save-profile').addEventListener('click', function () {
      var name = document.getElementById('display-name').value.trim();
      if (!name) { alert('Display name is required.'); return; }
      document.getElementById('profile-saved').style.display = 'block';
    });
  </script>
</div>
</body>
</html>
