<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site settings</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1a1d21; }
  header { background: #1f2937; color: #fff; padding: 14px 24px; }
  .wrap { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 28px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd2da; border-radius: 6px; font-size: 15px; font-family: inherit; }
  .primary { margin-top: 20px; background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 16px; cursor: pointer; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 10px; padding: 26px; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h2 { margin-top: 0; font-size: 18px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .btn-save { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .btn-discard { background: #fff; color: #374151; border: 1px solid #cbd2da; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .saved { display: none; margin-top: 18px; background: #dcfce7; color: #166534; border-radius: 8px; padding: 12px 14px; font-size: 15px; }
</style>
</head>
<body>
<header><strong>Dashboard</strong> — settings</header>
<div class="wrap">
  <h1>Site settings</h1>
  <label for="site-title">Site title</label>
  <input id="site-title" type="text" value="My Writing Blog">
  <label for="tagline">Tagline</label>
  <textarea id="tagline" rows="2">Notes on computation</textarea>
  <button id="save" class="primary">Save changes</button>
  <div id="saved" class="saved">Settings saved successfully.</div>

  <div id="confirm-modal" class="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Save these settings?</h2>
      <p>Your site title and tagline will be updated immediately.</p>
      <div class="modal-actions">
        <button id="confirm-no" class="btn-discard">Discard</button>
        <button id="confirm-yes" class="btn-save">Save</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('save').addEventListener('click', function () {
      document.getElementById('confirm-modal').classList.add('show');
    });
    document.getElementById('confirm-no').addEventListener('click', function () {
      document.getElementById('confirm-modal').classList.remove('show');
    });
    document.getElementById('confirm-yes').addEventListener('click', function () {
      document.getElementById('confirm-modal').classList.remove('show');
      document.getElementById('saved').style.display = 'block';
    });
  </script>
</div>
</body>
</html>
