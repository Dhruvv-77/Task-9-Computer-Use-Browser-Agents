<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subscription cancelled</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1a1d21; }
  .wrap { max-width: 520px; margin: 60px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 32px; text-align: center; }
  .badge { display: inline-block; background: #fee2e2; color: #991b1b; border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 600; }
  h1 { font-size: 24px; }
  p { color: #4b5563; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Cancelled</span>
  <h1 id="cancelled">Subscription cancelled</h1>
  <p>Your Premium plan will end on November 3, 2026. We sent a confirmation email.</p>
</div>
</body>
</html>
