<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report ready</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1a1d21; }
  .wrap { max-width: 560px; margin: 60px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 32px; text-align: center; }
  .badge { display: inline-block; background: #dbeafe; color: #1e40af; border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 600; }
  h1 { font-size: 24px; }
  p { line-height: 1.6; color: #4b5563; }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Loaded</span>
  <h1 id="report-ready">Report ready</h1>
  <p>Your analytics report finished loading after the delayed data fetch.</p>
</div>
</body>
</html>
