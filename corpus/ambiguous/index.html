<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appointment form</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1a1d21; }
  header { background: #334155; color: #fff; padding: 14px 24px; }
  .wrap { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 28px; }
  h1 { font-size: 21px; }
  .instructions { background: #fef9c3; border: 1px solid #fde047; border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #713f12; margin-bottom: 18px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd2da; border-radius: 6px; font-size: 15px; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .primary { margin-top: 20px; background: #334155; color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 16px; cursor: pointer; }
  #submitted { display: none; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; margin-top: 16px; font-size: 15px; color: #334155; }
</style>
</head>
<body>
<header><strong>Clinic Portal</strong> — booking</header>
<div class="wrap">
  <h1>Book an appointment</h1>
  <div class="instructions">Fill in the form below and submit to request an appointment.</div>
  <label for="patient">Patient name</label>
  <input id="patient" type="text" placeholder="Jane Doe">
  <label for="date">Date</label>
  <input id="date" type="text" placeholder="DD/MM/YYYY">
  <div class="hint">Enter the date.</div>
  <button id="submit-request" class="primary">Submit request</button>
  <div id="submitted">Request recorded — our staff will review it manually.</div>
  <script>
    document.getElementById('submit-request').addEventListener('click', function () {
      document.getElementById('submitted').style.display = 'block';
    });
  </script>
</div>
</body>
</html>
